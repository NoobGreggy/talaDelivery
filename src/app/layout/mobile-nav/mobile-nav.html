<nav class="flex items-center justify-around border-t border-slate-200 bg-white px-2 py-2">
  @for (item of navItems; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="text-sky-600"
      [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      class="flex flex-col items-center gap-0.5 px-2 py-1 text-xs font-medium text-slate-500 transition-colors duration-150">
      <svg
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
      </svg>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
