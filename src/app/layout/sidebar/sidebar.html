<aside
  class="sidebar flex h-full flex-col border-r transition-all duration-300"
  [class.sidebar--collapsed]="collapsed()"
  [class.w-64]="!collapsed()"
  [class.w-16]="collapsed()">

  <!-- Brand and sidebar toggle -->
  <div class="sidebar-header flex h-16 shrink-0 items-center border-b">
    <div class="sidebar-brand-slot">
      <img class="sidebar-logo" [class.sidebar-logo--collapsed]="collapsed()" src="images/tala-logo.png" alt="TalaDelivery" />
    </div>
    @if (!collapsed()) {
      <span class="sidebar-brand-name min-w-0 flex-1 truncate text-lg font-bold">TalaDelivery</span>
    }
    <button
      type="button"
      (click)="toggleCollapse.emit()"
      class="sidebar-toggle hidden shrink-0 lg:flex"
      [class.sidebar-toggle--expand]="collapsed()"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!collapsed()"
      [title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg aria-hidden="true" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="16" rx="3" />
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="collapsed() ? 'M9 4v16m4-11 3 3-3 3' : 'M9 4v16m7-11-3 3 3 3'" />
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-2 py-4">
    @for (group of visibleGroups(); track group.label) {
      <div class="mb-4">
        @if (!collapsed()) {
          <p class="mb-1 px-3 sidebar-group-label text-xs font-semibold uppercase tracking-wider">
            {{ group.label }}
          </p>
        } @else {
          <div class="sidebar-divider mx-auto mb-1 h-px w-8"></div>
        }

        @for (item of group.items; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="sidebar-link--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="sidebar-link mb-0.5 flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-colors duration-150"
            [class.justify-center]="collapsed()"
            [class.px-3]="!collapsed()"
            [title]="collapsed() ? item.label : ''">
            <svg
              class="h-5 w-5 flex-shrink-0"
              [class.mr-3]="!collapsed()"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
            </svg>
            @if (!collapsed()) {
              <span>{{ item.label }}</span>
            }
          </a>
        }
      </div>
    }
  </nav>

</aside>
