<div class="relative isolate flex h-screen bg-slate-50">
  <!-- Desktop Sidebar -->
  <div class="relative z-40 hidden lg:block">
    <app-sidebar [collapsed]="sidebarCollapsed()" (toggleCollapse)="toggleSidebar()" />
  </div>

  <!-- Mobile Sidebar Overlay -->
  @if (mobileMenuOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <div class="absolute inset-0 bg-black/50" (click)="closeMobileMenu()"></div>
      <div class="relative z-50 h-full w-72 max-w-[86vw]">
        <app-sidebar [collapsed]="false" (toggleCollapse)="closeMobileMenu()" />
      </div>
    </div>
  }

  <!-- Main Content -->
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-topbar (menuToggle)="toggleMobileMenu()" />

    <main class="relative z-0 flex-1 overflow-y-auto p-4 lg:p-6">
      <router-outlet />
    </main>

    <!-- Mobile Bottom Nav -->
    <div class="lg:hidden">
      <app-mobile-nav />
    </div>
  </div>
</div>
