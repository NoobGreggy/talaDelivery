<div class="admin-shell flex h-screen">
  <!-- Desktop Sidebar -->
  <div class="admin-sidebar hidden shrink-0 lg:block">
    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      (toggleCollapse)="toggleSidebar()" />
  </div>

  <!-- Mobile Sidebar Overlay -->
  @if (mobileMenuOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <div class="absolute inset-0 bg-black/50" (click)="closeMobileMenu()"></div>
      <div class="relative z-50 h-full w-64">
        <app-sidebar
          [collapsed]="false"
          (toggleCollapse)="closeMobileMenu()" />
      </div>
    </div>
  }

  <!-- Main Content -->
  <div class="admin-workspace flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-topbar
      (menuToggle)="toggleMobileMenu()" />

    <main class="admin-content flex-1 overflow-y-auto">
      <router-outlet />
    </main>

    <!-- Mobile Bottom Nav -->
    <div class="lg:hidden">
      <app-mobile-nav />
    </div>
  </div>
</div>
