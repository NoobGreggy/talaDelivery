@if (open()) {
  <div class="merchant-side-modal-shell">
    <button
      type="button"
      class="merchant-side-modal__overlay"
      aria-label="Close dialog"
      (click)="close()"
    ></button>
    <section
      class="merchant-side-modal"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || 'Dialog'"
    >
      <div class="merchant-side-modal__header">
        @if (title()) {
          <div>
            <span class="merchant-side-modal__eyebrow">TalaDelivery Merchant</span>
            <h2>{{ title() }}</h2>
          </div>
        }
        <button
          type="button"
          class="merchant-side-modal__close"
          (click)="close()"
          aria-label="Close"
        >
          <i data-tala="x" class="tala-x tala-sm" aria-hidden="true"></i>
        </button>
      </div>
      <div class="merchant-side-modal__body">
        <ng-content></ng-content>
      </div>
    </section>
  </div>
}
