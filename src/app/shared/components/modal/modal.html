@if (open()) {
  <div class="tala-side-overlay" [class.tala-side-overlay--center]="placement() === 'center'" (click)="close()">
    <div class="tala-side-panel" [class.tala-side-panel--wide]="size() === 'wide'" [class.tala-side-panel--center]="placement() === 'center'" role="dialog" aria-modal="true" [attr.aria-label]="title() || 'Dialog'" (click)="$event.stopPropagation()">
      <header class="tala-side-header">
        <div><p class="tala-side-eyebrow">TalaDelivery <span>/ Administration</span></p>
          @if (title()) { <h2>{{ title() }}</h2> }
        </div>
        <button type="button" class="tala-side-close" (click)="close()" aria-label="Close"><app-tala-icon name="x" [size]="20" /></button>
      </header>
      <div class="tala-side-body"><ng-content></ng-content></div>
    </div>
  </div>
}
