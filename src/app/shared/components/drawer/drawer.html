<div [class]="overlayClasses()" (click)="close()"></div>
<div class="tala-side-panel tala-existing-drawer fixed z-50" [class.tala-existing-drawer--left]="side() === 'left'" [class]="positionClasses() + ' ' + translateClasses()" role="dialog" [attr.aria-modal]="open() ? 'true' : null" [attr.aria-label]="title() || 'Drawer'">
  <header class="tala-side-header">
    <div><p class="tala-side-eyebrow">TalaDelivery <span>/ Administration</span></p>@if (title()) { <h2>{{ title() }}</h2> }</div>
    <button type="button" class="tala-side-close" (click)="close()" aria-label="Close drawer"><app-tala-icon name="x" [size]="20" /></button>
  </header>
  <div class="tala-side-body"><ng-content></ng-content></div>
</div>
