<div class="relative inline-block text-left">
  <div (click)="toggle()">
    <ng-content></ng-content>
  </div>

  @if (isOpen()) {
    <div
      class="absolute right-0 z-50 mt-2 w-48 origin-top-right rounded-[14px] border border-[var(--app-border)] bg-[var(--app-surface)] p-1.5 shadow-xl focus:outline-none"
    >
      @for (item of items(); track item.label) {
        <button
          type="button"
          class="flex w-full items-center gap-2 rounded-[9px] px-3 py-2 text-left text-sm font-medium transition-colors"
          [class]="
            item.danger ? 'text-red-600 hover:bg-red-50' : 'text-slate-700 hover:bg-slate-100'
          "
          (click)="selectItem(item.label)"
        >
          @if (item.icon) {
            <span class="text-slate-400">{{ item.icon }}</span>
          }
          {{ item.label }}
        </button>
      }
    </div>
  }
</div>
