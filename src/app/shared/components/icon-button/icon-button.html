<button
  type="button"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="title() || ariaLabel()"
  [disabled]="disabled()"
  [class]="
    'inline-flex items-center justify-center rounded-[11px] transition-colors focus:outline-none focus:ring-2 focus:ring-sky-500 disabled:opacity-50 disabled:cursor-not-allowed ' +
    variantClasses() +
    ' ' +
    sizeClasses()
  "
  (click)="handleClick()"
>
  <ng-content></ng-content>
</button>
