<nav class="tala-pagination flex items-center gap-1" aria-label="Table pagination">
  <button
    type="button"
    class="pagination-step inline-flex h-9 items-center justify-center rounded-full text-sm text-slate-600 transition-colors hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="currentPage() <= 1"
    (click)="goToPage(currentPage() - 1)"
    aria-label="Previous page"
  >
    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
    </svg>
    <span>Previous</span>
  </button>

  @for (page of pages(); track page) {
    <button
      type="button"
      class="pagination-page inline-flex h-9 min-w-9 items-center justify-center rounded-full px-2 text-sm transition-colors"
      [class]="
        page === currentPage()
          ? 'pagination-page--active font-medium'
          : 'text-slate-600 hover:bg-slate-100'
      "
      [attr.aria-current]="page === currentPage() ? 'page' : null"
      [attr.aria-label]="'Page ' + page"
      (click)="goToPage(page)"
    >
      {{ page }}
    </button>
  }

  <button
    type="button"
    class="pagination-step inline-flex h-9 items-center justify-center rounded-full text-sm text-slate-600 transition-colors hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="currentPage() >= totalPages()"
    (click)="goToPage(currentPage() + 1)"
    aria-label="Next page"
  >
    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
    </svg>
    <span>Next</span>
  </button>
</nav>
