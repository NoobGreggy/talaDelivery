<nav class="flex items-center justify-center gap-1">
  <button
    type="button"
    class="inline-flex h-9 w-9 items-center justify-center rounded-md text-sm text-slate-600 transition-colors hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="currentPage() <= 1"
    (click)="goToPage(currentPage() - 1)"
    aria-label="Previous page"
  >
    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
    </svg>
  </button>

  @for (page of pages(); track page) {
    <button
      type="button"
      class="inline-flex h-9 min-w-9 items-center justify-center rounded-md px-2 text-sm transition-colors"
      [class]="
        page === currentPage()
          ? 'bg-indigo-600 text-white font-medium'
          : 'text-slate-600 hover:bg-slate-100'
      "
      (click)="goToPage(page)"
    >
      {{ page }}
    </button>
  }

  <button
    type="button"
    class="inline-flex h-9 w-9 items-center justify-center rounded-md text-sm text-slate-600 transition-colors hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="currentPage() >= totalPages()"
    (click)="goToPage(currentPage() + 1)"
    aria-label="Next page"
  >
    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
    </svg>
  </button>
</nav>
