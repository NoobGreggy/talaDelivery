<div class="theme-switcher" [class.labeled]="labeled()" role="group" aria-label="Color theme">
  <button
    type="button"
    title="Use system theme"
    aria-label="Use system theme"
    [attr.aria-pressed]="theme.preference() === 'system'"
    [class.active]="theme.preference() === 'system'"
    (click)="setTheme('system')"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <rect x="3" y="4" width="18" height="13" rx="2" />
      <path d="M8 21h8M12 17v4" />
    </svg>
    @if (labeled()) {
      <span>System</span>
    }
  </button>
  <button
    type="button"
    title="Use light theme"
    aria-label="Use light theme"
    [attr.aria-pressed]="theme.preference() === 'light'"
    [class.active]="theme.preference() === 'light'"
    (click)="setTheme('light')"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
      />
    </svg>
    @if (labeled()) {
      <span>Light</span>
    }
  </button>
  <button
    type="button"
    title="Use dark theme"
    aria-label="Use dark theme"
    [attr.aria-pressed]="theme.preference() === 'dark'"
    [class.active]="theme.preference() === 'dark'"
    (click)="setTheme('dark')"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z" />
    </svg>
    @if (labeled()) {
      <span>Dark</span>
    }
  </button>
</div>
