<div class="overflow-hidden rounded-lg border border-slate-200">
  <div class="space-y-3 p-4">
    <div class="h-4 w-1/3 animate-pulse rounded bg-slate-200"></div>
    @for (row of [].constructor(rows()); track $index) {
      <div class="flex space-x-4">
        @for (column of [].constructor(columns()); track $index) {
          <div class="h-4 flex-1 animate-pulse rounded bg-slate-200"></div>
        }
      </div>
    }
  </div>
</div>
