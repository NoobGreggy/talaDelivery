@if (open()) {
  <div class="tala-side-overlay" (click)="cancel()">
    <div class="tala-side-panel" role="dialog" aria-modal="true" [attr.aria-label]="title()" (click)="$event.stopPropagation()">
      <header class="tala-side-header">
        <div><p class="tala-side-eyebrow">TalaDelivery <span>/ Confirmation</span></p><h2>{{ title() }}</h2></div>
        <button type="button" class="tala-side-close" (click)="cancel()" aria-label="Close confirmation"><app-tala-icon name="x" [size]="20" /></button>
      </header>
      <div class="tala-side-body">
        <div class="tala-confirm-mark" [class.tala-confirm-mark--danger]="danger()"><app-tala-icon [name]="danger() ? 'alert-triangle' : 'check-circle'" [size]="28" /></div>
        @if (message()) { <p class="tala-confirm-message">{{ message() }}</p> }
      </div>
      <footer class="tala-side-footer">
        <button type="button" class="tala-panel-button tala-panel-button--secondary" (click)="cancel()">{{ cancelLabel() }}</button>
        <button type="button" class="tala-panel-button" [class.tala-panel-button--danger]="danger()" (click)="confirm()">{{ confirmLabel() }}</button>
      </footer>
    </div>
  </div>
}
