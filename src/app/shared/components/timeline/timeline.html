<ol class="relative">
  @for (event of events(); track event.label; let last = $last) {
    <li class="relative flex gap-4 pb-8">
      @if (!last) {
        <div class="absolute left-4 top-9 h-full w-px -translate-x-1/2 bg-slate-200"></div>
      }
      <div class="relative flex shrink-0 flex-col items-center">
        @if (event.completed) {
          <span
            class="flex h-8 w-8 items-center justify-center rounded-full bg-emerald-100"
          >
            <svg class="h-4 w-4 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </span>
        } @else if (event.active) {
          <span class="relative flex h-8 w-8 items-center justify-center">
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-sky-200 opacity-75"></span>
            <span class="relative inline-flex h-8 w-8 items-center justify-center rounded-full border-2 border-sky-600 bg-white">
              <span class="h-3 w-3 rounded-full bg-sky-600"></span>
            </span>
          </span>
        } @else {
          <span class="flex h-8 w-8 items-center justify-center rounded-full border-2 border-slate-300 bg-white">
            <span class="h-2.5 w-2.5 rounded-full bg-slate-300"></span>
          </span>
        }
      </div>
      <div
        class="pt-0.5"
        [class]="
          event.active
            ? 'text-slate-900'
            : event.completed
              ? 'text-slate-700'
              : 'text-slate-400'
        "
      >
        <p
          class="text-sm"
          [class]="event.active ? 'font-semibold' : event.completed ? 'font-medium' : 'font-normal'"
        >
          {{ event.label }}
        </p>
        @if (event.time) {
          <p class="mt-0.5 text-xs text-slate-400">{{ event.time }}</p>
        }
      </div>
    </li>
  }
</ol>
