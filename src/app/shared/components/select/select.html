<div>
  @if (label()) {
    <label class="mb-1.5 block text-sm font-medium text-slate-700">{{ label() }}</label>
  }
  <select
    class="block min-h-11 w-full rounded-[12px] border border-[var(--app-border)] bg-[var(--app-field)] px-3 py-2 text-sm text-[var(--app-ink)] transition-colors focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
    [value]="value()"
    (change)="onSelect($event)"
  >
    <option value="" disabled>{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</div>
