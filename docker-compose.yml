name: taladelivery-backend

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  POSTGRES_HOST: ${DOCKER_POSTGRES_HOST:-host.docker.internal}
  POSTGRES_PORT: '${POSTGRES_PORT:-5433}'
  REDIS_HOST: ${DOCKER_REDIS_HOST:-host.docker.internal}
  REDIS_PORT: '${REDIS_PORT:-6380}'
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
  OFFER_TTL_SECONDS: ${OFFER_TTL_SECONDS:-300}
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
  API_GATEWAY_URL: http://api-gateway:3000
  IDENTITY_SERVICE_URL: http://identity-service:3001
  MERCHANT_SERVICE_URL: http://merchant-service:3002
  CATALOG_SERVICE_URL: http://catalog-service:3003
  ORDER_SERVICE_URL: http://order-service:3004
  DISPATCH_SERVICE_URL: http://dispatch-service:3005
  PAYMENT_SERVICE_URL: http://payment-service:3006
  NOTIFICATION_SERVICE_URL: http://notification-service:3007
  REALTIME_SERVICE_URL: http://realtime-service:3008

x-app: &app
  image: taladelivery/backend:local
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  restart: unless-stopped
  env_file:
    - .env
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  # Storage is external: reuse the existing PostgreSQL and Redis connections.
  migrate:
    image: taladelivery/migrate:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    profiles: ['maintenance']
    restart: 'no'
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      <<: *service-env
      SERVICE_NAME: migrate

  api-gateway:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: api-gateway
      SERVICE_NAME: api-gateway
      PORT: '3000'
    ports: ['${API_BIND_ADDRESS:-0.0.0.0}:${API_GATEWAY_HOST_PORT:-3000}:3000']

  identity-service:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: identity-service
      SERVICE_NAME: identity-service
      PORT: '3001'

  merchant-service:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: merchant-service
      SERVICE_NAME: merchant-service
      PORT: '3002'

  catalog-service:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: catalog-service
      SERVICE_NAME: catalog-service
      PORT: '3003'

  order-service:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: order-service
      SERVICE_NAME: order-service
      PORT: '3004'

  dispatch-service:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: dispatch-service
      SERVICE_NAME: dispatch-service
      PORT: '3005'

  payment-service:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: payment-service
      SERVICE_NAME: payment-service
      PORT: '3006'

  notification-service:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: notification-service
      SERVICE_NAME: notification-service
      PORT: '3007'

  realtime-service:
    <<: *app
    environment:
      <<: *service-env
      APP_NAME: realtime-service
      SERVICE_NAME: realtime-service
      PORT: '3008'
    ports: ['${API_BIND_ADDRESS:-0.0.0.0}:${REALTIME_HOST_PORT:-3008}:3008']
